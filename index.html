<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b9d;
            --secondary: #c44569;
            --accent: #ffd93d;
            --bg: #fff5f7;
            --text: #2c1810;
            --white: #ffffff;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe5ec 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        .page {
            display: none;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Page 1: Question */
        #page1 {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.1;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.1;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--secondary);
            margin-bottom: 1rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 2rem;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-yes {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
        }

        .btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 107, 157, 0.4);
        }

        .btn-no {
            background: var(--white);
            color: var(--secondary);
            border: 2px solid var(--primary);
        }

        .btn-no:hover {
            background: var(--bg);
            transform: translateY(-3px);
        }

        /* Modal for "No" response */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            height: 100%;
            text-align: center;
            animation: scaleIn 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Page 2: Quiz */
        #page2 {
            flex-direction: column;
            align-items: center;
            padding-top: 2rem;
        }

        .quiz-container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 25px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .quiz-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            height: 8px;
            background: var(--bg);
            border-radius: 10px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question {
            display: none;
            animation: slideIn 0.4s ease;
        }

        .question.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .answer-btn {
            background: var(--bg);
            color: var(--text);
            padding: 1.25rem 1.5rem;
            border-radius: 15px;
            text-align: left;
            font-size: 1rem;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .answer-btn:hover {
            background: white;
            border-color: var(--primary);
            transform: translateX(5px);
        }

        /* Result Modal */
        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .result-modal.active {
            display: flex;
        }

        .result-content {
            background: white;
            border-radius: 25px;
            padding: 2.5rem 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: scaleIn 0.5s ease;
        }

        .result-emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .result-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--secondary);
            margin-bottom: 1rem;
        }

        .prize-image {
            width: 100%;
            max-width: 350px;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin: 1.5rem auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .prize-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 1rem;
        }

        .screenshot-text {
            background: var(--bg);
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text);
            margin-top: 1.5rem;
        }

        @media (min-width: 640px) {
            h1 {
                font-size: 3rem;
            }
        }
    </style>
</head>

    <!-- Floating Hearts Background -->
    <div class="hearts-bg" id="heartsContainer"></div>

    <!-- Page 1: Question -->
    <div id="page1" class="page active">
        <div class="content">
            <span class="emoji">💕</span>
            <h1>Will You Be My Hot to my Pot?</h1>
            <p class="subtitle">valentine vibes</p>
            <div class="button-group">
                <button class="btn-yes" onclick="startQuiz()">Yes! 💖</button>
                <button class="btn-no" onclick="showNoModal()">No 😢</button>
            </div>
        </div>
    </div>

    <!-- Modal for "No" Response -->
    <div id="noModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <img src="https://i.pinimg.com/236x/31/28/78/31287865fead0aea3d9e0c12b72371c9.jpg" alt="Please say yes!" id="noImage">
        </div>
    </div>

    <!-- Page 2: Quiz -->
    <div id="page2" class="page">
        <div class="quiz-container">

                <p class="subtitle">answer the following questions or else</p>

                    <button class="answer-btn" onclick="answer(1, 'lego')">Mal al Sham</button>
                </div>
            </div>

            <!-- Question 2 -->
            <div class="question" id="q2">
                <div class="question-text">How stinky are you today? 👃</div>
                <div class="answers">
                    <button class="answer-btn" onclick="answer(2, 'lego')">Little</button>
                    <button class="answer-btn" onclick="answer(2, 'socks')">Needs a shower</button>
                    <button class="answer-btn" onclick="answer(2, 'yoga')">Killed a few people on the way here</button>
                </div>
            </div>

            <!-- Question 3 -->
            <div class="question" id="q3">
                <div class="question-text">How much do you love Jana? 💖</div>
                <div class="answers">
                    <button class="answer-btn" onclick="answer(3, 'all')">A lot</button>
                    <button class="answer-btn" onclick="answer(3, 'all')">A lot</button>
                    <button class="answer-btn" onclick="answer(3, 'all')">A lot</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="result-modal">
        <div class="result-content">
            <div class="result-emoji">🎉</div>
            <h2>you win a car...not</h2>
            
            <img id="prizeImage" class="prize-image" src="" alt="Your Prize">
            <div class="prize-name" id="prizeName"></div>
            
            <div class="screenshot-text">
                📸 Screenshot this and send it to me cuz im lazy
            </div>
        </div>
    </div>

                id: 'lego'
            }
        };

        let currentQuestion = 1;
        let scores = {
            socks: 0,
            yoga: 0,
            lego: 0
        };

        // Create floating hearts
        function createHearts() {
            const container = document.getElementById('heartsContainer');
            const hearts = ['💕', '💖', '💗', '💓', '💝'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                container.appendChild(heart);
            }
        }

        createHearts();

        function showNoModal() {
            document.getElementById('noModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('noModal').classList.remove('active');
        }

        function startQuiz() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            updateProgress();
        }

        function updateProgress() {
            const progress = ((currentQuestion - 1) / 3) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function answer(questionNum, choice) {
            // Add points
            if (choice !== 'all') {
                scores[choice]++;
            }

            // Move to next question or show results
            if (currentQuestion < 3) {
                document.getElementById('q' + currentQuestion).classList.remove('active');
                currentQuestion++;
                document.getElementById('q' + currentQuestion).classList.add('active');
                updateProgress();
            } else {
                showResults();
            }
        }

        function showResults() {
            // Update progress to 100%
            document.getElementById('progressFill').style.width = '100%';

            // Determine winner
            let winner = 'socks';
            let maxScore = scores.socks;

            if (scores.yoga > maxScore) {
                winner = 'yoga';
                maxScore = scores.yoga;
            }
            if (scores.lego > maxScore) {
                winner = 'lego';
            }

            // If tied, random
            const tied = Object.keys(scores).filter(key => scores[key] === maxScore);
            if (tied.length > 1) {
                winner = tied[Math.floor(Math.random() * tied.length)];
            }

            // Show result modal
            const prize = prizes[winner];
            document.getElementById('prizeImage').src = prize.image;
            document.getElementById('prizeName').textContent = prize.name;
            document.getElementById('resultModal').classList.add('active');

            // Send email
            const timestamp = new Date().toLocaleString();
            document.getElementById('prizeInput').value = prize.name;
            document.getElementById('timeInput').value = timestamp;
            document.getElementById('nextInput').value = window.location.href;
            document.getElementById('emailForm').submit();

            console.log('Prize:', prize.name);
            console.log('Scores:', scores);
        }
    </script>
